name: Login worker regression tests
on:
  push:
    branches: [main, 'test/**']
  pull_request:
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python: ['3.11', '3.14']
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: ${{ matrix.python }}
      # Same aiohttp as the locked runtime; test tools pinned as well.
      - run: python -m pip install aiohttp==3.14.4 pytest==9.1.1 pytest-asyncio==1.4.0
      - run: python -m pytest -q stellantis_login_worker/tests/test_request_reliability.py stellantis_login_worker/tests/test_login_outcomes.py
      - run: python stellantis_login_worker/tests/smoke_worker.py
