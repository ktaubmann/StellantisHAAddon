name: Build add-on images
on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    runs-on: ${{ matrix.platform.runner }}
    permissions:
      contents: read
      packages: write
      id-token: write
    strategy:
      fail-fast: false
      matrix:
        platform:
          - arch: amd64
            runner: ubuntu-latest
          - arch: aarch64
            runner: ubuntu-24.04-arm
        addon:
          - target: stellantis_vehicles
            image: stellantis-vehicles
          - target: stellantis_login_worker
            image: stellantis-login-worker
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.11'
      - name: Install build metadata reader
        run: python -m pip install PyYAML==6.0.3
      - name: Read add-on metadata
        id: metadata
        env:
          ADDON_TARGET: ${{ matrix.addon.target }}
          ADDON_ARCH: ${{ matrix.platform.arch }}
        run: |
          python - <<'PYTHON'
          import os
          from pathlib import Path
          import yaml

          target = Path(os.environ["ADDON_TARGET"])
          config = yaml.safe_load((target / "config.yaml").read_text())
          build = yaml.safe_load((target / "build.yaml").read_text())
          version = str(config["version"])
          ref = os.environ["GITHUB_REF"]
          publish = os.environ["GITHUB_EVENT_NAME"] != "pull_request" and (
              ref == "refs/heads/main" or ref.startswith("refs/tags/v"))
          tags = [version, "latest"] if publish else [version]
          labels = {**build.get("labels", {}), "io.hass.type": "addon"}
          with open(os.environ["GITHUB_OUTPUT"], "a") as output:
              print(f"version={version}", file=output)
              print(f"owner={os.environ['GITHUB_REPOSITORY_OWNER'].lower()}", file=output)
              print(f"build_from={build['build_from'][os.environ['ADDON_ARCH']]}", file=output)
              print(f"publish={str(publish).lower()}", file=output)
              print("tags<<TAGS", *tags, "TAGS", sep="\n", file=output)
              print("labels<<LABELS", *(f"{k}={v}" for k, v in labels.items()),
                    "LABELS", sep="\n", file=output)
          PYTHON
      - name: Build image
        uses: home-assistant/builder/actions/build-image@250ea2192b6df8ba411f158b5b6c13e09e657eff
        with:
          arch: ${{ matrix.platform.arch }}
          context: ${{ matrix.addon.target }}
          container-registry-password: ${{ secrets.GITHUB_TOKEN }}
          image: ghcr.io/${{ steps.metadata.outputs.owner }}/${{ matrix.addon.image }}-${{ matrix.platform.arch }}
          image-tags: ${{ steps.metadata.outputs.tags }}
          version: ${{ steps.metadata.outputs.version }}
          build-args: BUILD_FROM=${{ steps.metadata.outputs.build_from }}
          labels: ${{ steps.metadata.outputs.labels }}
          cache-gha-scope: ${{ matrix.addon.target }}
          push: ${{ steps.metadata.outputs.publish }}
          cosign: ${{ steps.metadata.outputs.publish }}
