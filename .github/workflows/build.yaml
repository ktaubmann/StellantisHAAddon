name: Build add-on images
on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    runs-on: ${{ matrix.platform.runner }}
    permissions:
      contents: read
      packages: write
      id-token: write
    strategy:
      fail-fast: false
      matrix:
        platform:
          - arch: amd64
            runner: ubuntu-latest
          - arch: aarch64
            runner: ubuntu-24.04-arm
        addon:
          - target: stellantis_vehicles
            image: stellantis-vehicles
          - target: stellantis_login_worker
            image: stellantis-login-worker
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Read add-on metadata
        id: metadata
        env:
          ADDON_TARGET: ${{ matrix.addon.target }}
        run: |
          echo "version=$(sed -n 's/^version: //p' "$ADDON_TARGET/config.yaml")" >> "$GITHUB_OUTPUT"
          echo "owner=${GITHUB_REPOSITORY_OWNER,,}" >> "$GITHUB_OUTPUT"
      - name: Build image
        uses: home-assistant/builder/actions/build-image@250ea2192b6df8ba411f158b5b6c13e09e657eff
        with:
          arch: ${{ matrix.platform.arch }}
          context: ${{ matrix.addon.target }}
          container-registry-password: ${{ secrets.GITHUB_TOKEN }}
          image: ghcr.io/${{ steps.metadata.outputs.owner }}/${{ matrix.addon.image }}-${{ matrix.platform.arch }}
          image-tags: ${{ steps.metadata.outputs.version }}
          version: ${{ steps.metadata.outputs.version }}
          build-args: BUILD_FROM=ghcr.io/home-assistant/${{ matrix.platform.arch }}-base-debian:bookworm
          labels: |
            io.hass.type=addon
            org.opencontainers.image.licenses=MIT
          cache-gha-scope: ${{ matrix.addon.target }}
          push: ${{ github.event_name != 'pull_request' }}
          cosign: ${{ github.event_name != 'pull_request' }}
