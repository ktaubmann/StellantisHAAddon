name: Stellantis Vehicles
version: 0.2.2
slug: stellantis_vehicles
description: Stellantis (Peugeot, Citroën, DS, Opel, Vauxhall) vehicles via MQTT, with local OAuth login
url: https://github.com/ktaubmann/StellantisHAAddon
arch:
  - aarch64
  - amd64
image: ghcr.io/ktaubmann/stellantis-vehicles-{arch}
init: false
startup: services
boot: auto
ingress: true
ingress_port: 8099
panel_icon: mdi:car-electric
panel_title: Stellantis
services:
  - mqtt:want
map:
  - type: homeassistant_config
    read_only: false
options:
  mobile_app: MyPeugeot
  country_code: DE
  email: ""
  password: ""
  oauth_mode: browser
  remote_commands: true
  language: de
  log_level: info
  mqtt:
    host: ""
    port: 1883
    username: ""
    password: ""
schema:
  mobile_app: list(MyPeugeot|MyCitroen|MyDS|MyOpel|MyVauxhall)
  country_code: str
  email: email
  password: password
  oauth_mode: list(browser|manual)
  remote_commands: bool
  language: list(en|de|cz|da|es|fi|fr|it|nb|nl|no|pl|pt|sl|sv)
  log_level: list(debug|info|warning|error)
  mqtt:
    host: str?
    port: port?
    username: str?
    password: password?
